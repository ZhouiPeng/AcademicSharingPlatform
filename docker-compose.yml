services:
  user-service:
    build: ./services/user-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_USER_DB_NAME=${MYSQL_USER_DB_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    expose:
      - "8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://user-service:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  achievement-service:
    build: ./services/achievement-service
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ACHIEVE_DB_NAME=${MYSQL_ACHIEVE_DB_NAME}
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=true
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    expose:
      - "8082"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://achievement-service:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-service:
    build: ./services/file-service
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_FILE_DB_NAME=${MYSQL_FILE_DB_NAME}
      - OBS_ENDPOINT=${OBS_ENDPOINT}
      - OBS_ACCESS_KEY=${OBS_ACCESS_KEY}
      - OBS_SECRET_KEY=${OBS_SECRET_KEY}
      - OBS_BUCKET=${OBS_BUCKET}
    expose:
      - "8083"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://file-service:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-sync-service:
    build: ./services/data-sync-service
    expose:
      - "8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://data-sync-service:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-service:
    build: ./services/analytics-service
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ANALYTICS_DB_NAME=${MYSQL_ANALYTICS_DB_NAME}
    expose:
      - "8084"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://analytics-service:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-service:
    build: ./services/admin-service
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ADMIN_DB_NAME=${MYSQL_ADMIN_DB_NAME}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_ADMIN_DB_NAME=${MONGO_ADMIN_DB_NAME}
    expose:
      - "8085"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://admin-service:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build: ./services/gateway-service
    environment:
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      file-service:
        condition: service_healthy
      data-sync-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      # achievement-service:
      #   condition: service_healthy
      admin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://gateway-service:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5