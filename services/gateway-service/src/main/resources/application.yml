spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: achievement-service
          uri: http://achievement-service:8082
          predicates:
            - Path=/api/achievements/**
        - id: file-service
          uri: http://file-service:8083
          predicates:
            - Path=/api/files/**
        - id: analytics-service
          uri: http://analytics-service:8084
          predicates:
            - Path=/api/analysis/**
        - id: admin-service
          uri: http://admin-service:8085
          predicates:
            - Path=/api/admin/**
        - id: data-sync-service
          uri: http://data-sync-service:8086
          predicates:
            - Path=/api/sync/**

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
