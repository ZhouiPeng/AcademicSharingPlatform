spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: achievement-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/achievements/**
        - id: file-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/files/**
        - id: file-obs
          uri: http://localhost:8083
          predicates:
            - Path=/api/obs/**
        - id: analytics-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/analysis/**
        - id: admin-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/admin/**
        - id: data-sync-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/sync/**

server:
  port: 8080

user:
  service:
    url: http://localhost:8081

achievement:
  service:
    url: http://localhost:8082

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
