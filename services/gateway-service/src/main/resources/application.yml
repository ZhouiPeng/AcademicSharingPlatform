spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: true
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
        - id: achievement-service
          uri: http://achievement-service:8082
          predicates:
            - Path=/api/achievements/**
        - id: file-service
          uri: http://file-service:8083
          predicates:
            - Path=/api/files/**
        - id: analytics-service
          uri: http://analytics-service:8084
          predicates:
            - Path=/api/analysis/**
        - id: admin-service
          uri: http://admin-service:8085
          predicates:
            - Path=/api/admin/**
        - id: data-sync-service
          uri: http://data-sync-service:8086
          predicates:
            - Path=/api/sync/**

        # Proxy endpoints for OpenAPI docs from downstream services so the browser can fetch via gateway
        - id: openapi-file-service
          uri: http://file-service:8083
          predicates:
            - Path=/gateway-api-docs/file-service/**
          filters:
            - RewritePath=^/gateway-api-docs/file-service(/.*)?,/v3/api-docs$1

        - id: openapi-user-service
          uri: http://user-service:8081
          predicates:
            - Path=/gateway-api-docs/user-service/**
          filters:
            - RewritePath=^/gateway-api-docs/user-service(/.*)?,/v3/api-docs$1

        - id: openapi-achievement-service
          uri: http://achievement-service:8082
          predicates:
            - Path=/gateway-api-docs/achievement-service/**
          filters:
            - RewritePath=^/gateway-api-docs/achievement-service(/.*)?,/v3/api-docs$1

        - id: openapi-analytics-service
          uri: http://analytics-service:8084
          predicates:
            - Path=/gateway-api-docs/analytics-service/**
          filters:
            - RewritePath=^/gateway-api-docs/analytics-service(/.*)?,/v3/api-docs$1

        - id: openapi-admin-service
          uri: http://admin-service:8085
          predicates:
            - Path=/gateway-api-docs/admin-service/**
          filters:
            - RewritePath=^/gateway-api-docs/admin-service(/.*)?,/v3/api-docs$1

        - id: openapi-data-sync-service
          uri: http://data-sync-service:8086
          predicates:
            - Path=/gateway-api-docs/data-sync-service/**
          filters:
            - RewritePath=^/gateway-api-docs/data-sync-service(/.*)?,/v3/api-docs$1

gateway:
  swagger:
    urls:
      - "File Service|/gateway-api-docs/file-service"
      # - "User Service|/gateway-api-docs/user-service"
      # - "Achievement Service|/gateway-api-docs/achievement-service"
      - "Analytics Service|/gateway-api-docs/analytics-service"
      # - "Admin Service|/gateway-api-docs/admin-service"
      - "DataSync Service|/gateway-api-docs/data-sync-service"

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    configUrl: /v3/api-docs/gateway-swagger-config

server:
  port: 8080