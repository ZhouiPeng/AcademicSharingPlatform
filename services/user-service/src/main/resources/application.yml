mybatis-plus:
  type-aliases-package: com.academic.user.dto
#  mapper-locations: classpath:/mapper/**.xml
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/users
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8081

spring.mail:
  host: ${SMTP_HOST}
  port: ${SMTP_PORT}
  username: ${SMTP_USER}
  password: ${SMTP_PASS}
  properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true  # 启用TLS
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
