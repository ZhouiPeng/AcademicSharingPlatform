mybatis-plus:
  type-aliases-package: com.academic.user.dto
#  mapper-locations: classpath:/mapper/**.xml
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/users
    username: root
    password: L654
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    # Read SMTP settings from environment variables for security. Provide these
    # via your process manager / CI / container runtime. Defaults shown are for
    # local testing only and should be overridden.
    host: ${SMTP_HOST:smtp.example.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls.enable: ${SMTP_STARTTLS:true}
# Admin test email endpoint controls
mail:
  test:
    enabled: ${MAIL_TEST_ENABLED:false}
    # Optional token that must be supplied in header X-ADMIN-TOKEN when calling the test endpoint
    token: ${MAIL_TEST_TOKEN:}
server:
  port: 8081

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
