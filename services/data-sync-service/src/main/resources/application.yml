server:
  port: 8086

# DataSync auto-crawl configuration
datasync:
  # Whether the scheduled auto-crawl is enabled. Set true to enable daily 02:00 run.
  auto-enabled: ${auto-enabled:false}
  # Comma-separated list of categories to fetch from OpenAlex/arXiv (example values)
  auto-categories: cs.AI,cs.CL,cs.LG
  # Number of items to fetch per category
  per-category-count: 10

# Scheduling / task pool (optional tuning)
spring:
  application:
    name: data-sync-service
  task:
    scheduling:
      pool:
        size: 4

springdoc:
  swagger-ui:
    enabled: false
