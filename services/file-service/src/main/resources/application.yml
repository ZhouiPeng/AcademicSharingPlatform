server:
  port: 8083


springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html

obs:
  endpoint: ${OBS_ENDPOINT}
  accessKey: ${OBS_ACCESS_KEY}
  secretKey: ${OBS_SECRET_KEY}
  bucket: ${OBS_BUCKET}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_FILE_DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration