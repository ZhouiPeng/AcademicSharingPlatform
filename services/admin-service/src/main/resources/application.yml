spring:
  application:
    name: admin-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://${MONGO_HOST:124.70.81.32}:${MONGO_PORT:27017}/${MONGO_DB:admin_service}}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:124.70.81.32}:${MYSQL_PORT:3306}/${MYSQL_DB:admin_service}}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:password}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8085

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
